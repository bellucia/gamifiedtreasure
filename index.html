<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Rewards — Idle</title>

<style>
  /* =========================================================
     DESIGN TOKENS  (pulled 1:1 from the Figma node)
     ========================================================= */
  :root {
    /* ---- color ---- */
    --color-bg-cream:            #f8f1e8;   /* page bg */
    --color-gold-500:            #fdaf27;   /* accent/accent-primary */
    --color-gold-600:            #ee9802;   /* gold-600 (gradient stop) */
    --color-gold-700:            #f47f00;   /* deepest gradient stop */
    --color-purple:              #a605ad;   /* secondary/01 */
    --color-purple-stroke-10:    rgba(166, 5, 173, 0.1); /* secondary/01 @ 10% opacity, for quick-link circle strokes */
    --color-white:               #ffffff;
    --color-text-primary:        #1f1f1f;
    --color-text-secondary:      #666666;
    --color-text-on-color:       #1f1f1f;
    --color-btn-white-bg:        #ffffff;
    --color-tooltip-bg:          #feedcf;   /* background/bg-accent-primary */
    --color-fomo-bg:             rgba(0,0,0,0.02);
    --color-fomo-border:         rgba(0,0,0,0.07);

    /* ---- button tokens (from Jago Button Design System: MainButton/secondary
       and SmallButton/white — https://figma.com/design/WLEgTddEalEypoLDedveW8) ---- */
    --accent-primary:                #fdaf27;  /* accent/accent-primary        */
    --accent-neutral:                #1f1f1f;  /* accent/accent-neutral        */
    --accent-disabled:               #bfbfbf;  /* accent/accent-disabled       */
    --button-primary-pressed-bg:     #fdcf7d;  /* button/button-primary-pressed-bg — used as border color on secondary-pressed */
    --button-white-bg:               #ffffff;  /* button/button-white-bg       */
    --button-white-pressed-bg:       #e3e3e3;  /* button/button-white-pressed-bg */
    --text-primary:                  #1f1f1f;  /* text/text-primary            */
    --text-primary-inverse:          #ffffff;  /* text/text-primary-inverse    */

    /* ---- radius ---- */
    --radius-button:             8px;
    --radius-xxl:                32px;
    --radius-pill:               70.603px;
    --radius-fomo:                10px;

    /* ---- spacing ---- */
    --space-6:                   6px;
    --space-8:                   8px;
    --space-12:                  12px;

    /* ---- type ---- */
    --font-display: "TT Commons", "Poppins", "Segoe UI", sans-serif;

    --font-size-caption:    15px;
    --line-height-caption:  18px;

    --font-size-subhead:    16px;
    --line-height-subhead:  18px;

    --font-size-subhead-2:   17px;
    --line-height-subhead-2: 20px;

    --font-size-title:      19px;
    --line-height-title:    22px;

    /* ---- effects ---- */
    --shadow-sm: 0 0 4px rgba(0,0,0,0.1);
    --shadow-tooltip: 0 0 2px rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #d8d8d8; /* neutral surround so the mobile frame reads as a device on wide viewports */
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     SCREEN / FRAME  — mobile-first, scales up gracefully
     ========================================================= */
  .screen {
    position: relative;
    width: 100%;
    max-width: 430px;      /* design frame is 375, allow a little breathing room up to 430 */
    min-height: 100vh;
    margin: 0 auto;
    background: var(--color-bg-cream);
    overflow: hidden;
    isolation: isolate;
  }

  @media (min-width: 431px) {
    body { display: flex; justify-content: center; padding: 32px 0; }
    .screen {
      min-height: 812px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
  }

  /* =========================================================
     BACKGROUND — radial gold gradient + soft blurred blobs
     ========================================================= */
  .bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, var(--color-gold-500) 0%, var(--color-white) 100%);
    z-index: 0;
  }

  .bg__blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
  }

  .bg__blob--one {
    width: 62%;
    aspect-ratio: 1;
    left: 15%;
    top: -45%;
    background: radial-gradient(circle at 50% 50%, var(--color-gold-700), transparent 70%);
  }

  .bg__blob--two {
    width: 48%;
    aspect-ratio: 1;
    left: -30%;
    top: -30%;
    background: radial-gradient(circle at 50% 50%, var(--color-white), transparent 70%);
  }

  .sparkles {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 132px; /* was 172px, raised by 40px per request */
    width: 160px;
    max-width: 70%;
    aspect-ratio: 301 / 189;
    z-index: 2;
    pointer-events: none;
  }

  /* Each sparkle positioned per its real layer coords in node 338:3951
     (native 301×189 frame), converted to % so they scale with the container. */
  .sparkle {
    position: absolute;
    display: block;
    transform-origin: center;
    animation: sparklePulse 2.2s ease-in-out infinite;
  }
  .sparkle img { width: 100%; height: 100%; display: block; }

  .sparkle--1 { left: 90.73%;  top: 4.76%;  width: 5.48%; height: 9.55%;  animation-delay: 0s;    }
  .sparkle--2 { left: 5.95%;   top: 0%;     width: 5.48%; height: 9.55%;  animation-delay: 0.55s; }
  .sparkle--3 { left: 103.69%; top: 86.24%; width: 7.97%; height: 13.76%; animation-delay: 1.1s;  }
  .sparkle--4 { left: -11.99%; top: 79.89%; width: 7.31%; height: 12.70%; animation-delay: 1.65s; }

  @keyframes sparklePulse {
    0%, 100% { transform: scale(0.8);  }
    50%      { transform: scale(1.15); }
  }

  /* =========================================================
     HEADER — app bar (close icon + "My Rewards" pill)
     ========================================================= */
  .header {
    position: relative;
    z-index: 3;
    width: 100%;
  }

  .app-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 50px;
    /* Reserve space for the device status bar / notch on every platform:
       - 52px is a safe generic baseline (44px common bar height + 8px extra buffer)
       - env(safe-area-inset-top) covers notches/dynamic islands/punch-holes
         when running full-screen (PWA / native webview)
       - max() picks whichever is larger, so this works whether or not the
         browser reports a safe-area inset */
    padding-top: max(52px, env(safe-area-inset-top, 52px));
    padding-bottom: 13px;
    padding-left: 16px;
    padding-right: 16px;
    width: 100%;
  }

  .icon-btn {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text-primary);
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.12s ease, opacity 0.12s ease;
  }
  .icon-btn svg { width: 100%; height: 100%; }
  .icon-btn:active,
  .icon-btn.is-pressed {
    background-color: rgba(31,31,31,0.08); /* no dedicated icon-button token in the doc; mirrors the same restrained pressed treatment used elsewhere */
  }
  .icon-btn:disabled,
  .icon-btn.is-disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  /* SmallButton / type=white — states per Jago Button doc (node 366:3703/3705/3709) */
  .btn-pill-white {
    background: var(--button-white-bg);       /* default: button/button-white-bg */
    border: none;
    border-radius: var(--radius-xxl);
    padding: 5px 14px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--font-size-subhead-2);
    line-height: var(--line-height-subhead-2);
    color: var(--text-primary);               /* default: text/text-primary */
    white-space: nowrap;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.12s ease;
  }
  .btn-pill-white:active,
  .btn-pill-white.is-pressed {
    background: var(--button-white-pressed-bg); /* pressed: button/button-white-pressed-bg #e3e3e3 */
    box-shadow: none;
  }
  .btn-pill-white:disabled,
  .btn-pill-white.is-disabled {
    background: var(--accent-disabled);          /* disabled: accent/accent-disabled #bfbfbf */
    color: var(--text-primary-inverse);          /* disabled: text/text-primary-inverse */
    box-shadow: none;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* =========================================================
     QUICK LINKS — T&C / How-to
     ========================================================= */
  /* =========================================================
     QUICK LINKS — T&C / How-to
     both are a plain wrapper div around two independent buttons:
     a circular icon button + a SmallButton/white label pill
     (Figma nodes 746:11289 and 738:7816)
     ========================================================= */
  .quick-link {
    position: absolute;
    z-index: 3;
    top: calc(70px + max(52px, env(safe-area-inset-top, 52px)));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: var(--font-display);
  }
  .quick-link--tnc { left: 16px; }
  .quick-link--howto { right: 16px; }

  .quick-link__circle {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-pill);
    border: 1.9px solid var(--color-purple-stroke-10);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.8), rgba(255,255,255,0.8)),
      radial-gradient(circle at 35% 30%, #fdaf27 0%, #f98a14 50%, #f67707 75%, #f46400 100%);
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .quick-link__circle img { width: 19px; height: 20px; display: block; }

  /* Not a literal instance of the doc's CircularButton (different visual treatment),
     so the pressed state mirrors the doc's intent — a subtle, restrained dimming —
     rather than inventing an unrelated new color. */
  .quick-link__circle-btn {
    display: flex;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .quick-link__circle-btn:active .quick-link__circle,
  .quick-link__circle-btn.is-pressed .quick-link__circle {
    transform: scale(0.94);
    filter: brightness(0.93);
  }
  .quick-link__circle-btn:disabled .quick-link__circle,
  .quick-link__circle-btn.is-disabled .quick-link__circle {
    opacity: 0.4;
    pointer-events: none;
  }

  /* =========================================================
     STAGE — dialogue bubble, treasure chest, ticket tooltip
     ========================================================= */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 300px;
    margin-top: 16px;
  }

  .dialogue-box {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 126px;
    height: 91px;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .dialogue-box__shape {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .dialogue-box__text {
    position: absolute;
    left: 50%;
    top: 28px;
    transform: translateX(-50%);
    width: 90px;
    text-align: center;
    font-weight: 400;
    font-size: var(--font-size-subhead-2);
    line-height: var(--line-height-subhead-2);
    color: var(--color-text-secondary);
    margin: 0;
  }

  .chest-wrap {
    position: absolute;
    z-index: 1;
    left: 50%;
    top: 134px;
    transform: translateX(-50%);
    transform-origin: 50% 85%;
    width: 144px;
    height: 138px;
    animation: chestShake 3.6s ease-in-out infinite;
    /* smoothly grows into the taller "opened" artwork (145×179) on tap */
    transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    /* button resets — chest-wrap is a real <button> for accessibility */
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chest-wrap:disabled { cursor: default; }
  .chest-wrap img.chest {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    transition: opacity 0.35s ease;
  }
  .chest-wrap img.chest--open { opacity: 0; }

  /* soft golden burst behind the chest at the moment of opening */
  .chest-burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 220%;
    height: 220%;
    transform: translate(-50%, -50%) scale(0.3);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(253,175,39,0.55) 0%, rgba(253,175,39,0) 70%);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes chestShake {
    0%, 8%, 100% { transform: translateX(-50%) rotate(0deg); }
    1%           { transform: translateX(-50%) rotate(-3deg); }
    2%           { transform: translateX(-50%) rotate(3deg); }
    3%           { transform: translateX(-50%) rotate(-2.4deg); }
    4%           { transform: translateX(-50%) rotate(2.4deg); }
    5%           { transform: translateX(-50%) rotate(-1.2deg); }
    6%           { transform: translateX(-50%) rotate(1.2deg); }
    7%           { transform: translateX(-50%) rotate(0deg); }
  }

  @keyframes chestPopOpen {
    0%   { transform: translateX(-50%) scale(0.92); }
    55%  { transform: translateX(-50%) scale(1.07); }
    100% { transform: translateX(-50%) scale(1); }
  }

  @keyframes chestBurst {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(1);   opacity: 0;   }
  }

  /* ---- opened state (triggered by tapping the chest) ---- */
  .stage.is-opened .chest-wrap {
    top: 93px;
    width: 145px;
    height: 179px;
    animation: chestPopOpen 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .stage.is-opened .chest-wrap img.chest--closed { opacity: 0; }
  .stage.is-opened .chest-wrap img.chest--open   { opacity: 1; }
  .stage.is-opened .chest-burst {
    animation: chestBurst 0.7s ease-out forwards;
  }

  .hand-guide {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 156px;
    transform: translate(15px, 0);
    width: 74px;
    height: 74px;
    pointer-events: none;
    animation: handGuideBob 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    transition: opacity 0.3s ease;
  }
  .hand-guide img { width: 100%; height: 100%; display: block; }

  @keyframes handGuideBob {
    0%, 100% { transform: translate(15px, 0); }
    50%      { transform: translate(15px, -7px); }
  }

  /* ---- opened state: dialogue box and hand guide fade out ---- */
  .stage.is-opened .dialogue-box {
    opacity: 0;
    transform: translateX(-50%) scale(0.88) translateY(6px);
    pointer-events: none;
  }
  .stage.is-opened .hand-guide {
    opacity: 0;
    animation: none;
    pointer-events: none;
  }

  .ticket-tooltip {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 259px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: var(--space-8);
    background: var(--color-tooltip-bg);
    border-radius: var(--radius-xxl);
    padding: var(--space-6) var(--space-12);
    box-shadow: var(--shadow-tooltip);
    white-space: nowrap;
  }
  .ticket-tooltip svg { width: 18px; height: 18px; flex: none; }
  .ticket-tooltip span {
    font-weight: 600;
    font-size: var(--font-size-caption);
    line-height: var(--line-height-caption);
    color: var(--color-text-on-color);
  }

  /* =========================================================
     INFO PANEL — copy, CTA, FOMO banner
     ========================================================= */
  .info-panel {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 32px;
    padding: 0 16px;
    margin-top: 24px;
    padding-bottom: 32px;
  }

  .info-panel__copy {
    margin: 0;
    text-align: center;
    font-weight: 400;
    font-size: var(--font-size-subhead);
    line-height: var(--line-height-subhead);
    color: var(--color-text-on-color);
  }

  /* MainButton / type=secondary — states per Jago Button doc (node 9:5402/5435/422:5356) */
  .btn-main {
    appearance: none;
    border: 1px solid var(--accent-primary);   /* default: accent/accent-primary #fdaf27 */
    background: transparent;
    border-radius: var(--radius-button);
    padding: 14px 24px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--font-size-title);
    line-height: var(--line-height-title);
    color: var(--text-primary);                /* default: text/text-primary */
    text-align: center;
    cursor: pointer;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.12s ease, background-color 0.12s ease, color 0.12s ease;
  }
  .btn-main:active,
  .btn-main.is-pressed {
    border-color: var(--button-primary-pressed-bg); /* pressed: border → button/button-primary-pressed-bg #fdcf7d */
    background: transparent;
  }
  .btn-main:disabled,
  .btn-main.is-disabled {
    border-color: transparent;
    background: var(--accent-disabled);         /* disabled: accent/accent-disabled #bfbfbf */
    color: var(--text-primary-inverse);          /* disabled: text/text-primary-inverse */
    cursor: not-allowed;
    pointer-events: none;
  }
  .btn-main:focus-visible { outline: 2px solid var(--color-purple); outline-offset: 2px; }

  .fomo {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: var(--radius-fomo);
    background: var(--color-fomo-bg);
    border: 1px solid var(--color-fomo-border);
    backdrop-filter: blur(10px);
  }
  .fomo p {
    margin: 0;
    flex: 1;
    font-weight: 400;
    font-size: var(--font-size-subhead);
    line-height: var(--line-height-subhead);
    color: var(--color-text-on-color);
  }
  .fomo strong {
    font-weight: 600;
    color: var(--color-purple);
  }

  /* =========================================================
     RESPONSIVE — scale stage & type gently on larger phones
     ========================================================= */
  @media (min-width: 380px) {
    .stage { height: 320px; }
  }

  @media (max-width: 340px) {
    .btn-pill-white { font-size: 15px; }
    .btn-main { font-size: 17px; }
  }

  /* Respect reduced motion preference (no motion in this state, kept for future additions) */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="screen">

  <!-- background -->
  <div class="bg" aria-hidden="true">
    <div class="bg__blob bg__blob--one"></div>
    <div class="bg__blob bg__blob--two"></div>
  </div>

  <!-- header -->
  <header class="header">
    <div class="app-bar">
      <button class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="btn-pill-white">My Rewards</button>
    </div>
  </header>

  <!-- quick links -->
  <div class="quick-link quick-link--tnc">
    <button class="quick-link__circle-btn" aria-label="Terms and Conditions">
      <span class="quick-link__circle">
        <img src="https://www.figma.com/api/mcp/asset/b094fdca-e9ec-4935-8a23-f8f23b183020.svg" alt="" />
      </span>
    </button>
    <button class="btn-pill-white" aria-label="Terms and Conditions">T&amp;C</button>
  </div>

  <div class="quick-link quick-link--howto">
    <button class="quick-link__circle-btn" aria-label="How to play">
      <span class="quick-link__circle">
        <img src="https://www.figma.com/api/mcp/asset/b094fdca-e9ec-4935-8a23-f8f23b183020.svg" alt="" />
      </span>
    </button>
    <button class="btn-pill-white" aria-label="How to play">How-to</button>
  </div>

  <!-- stage: dialogue + sparkles + chest + ticket -->
  <div class="stage">
    <div class="dialogue-box" aria-hidden="true">
      <img class="dialogue-box__shape" src="https://www.figma.com/api/mcp/asset/4334c6b3-3391-4f22-b762-29160ef09fa3.svg" alt="" />
      <p class="dialogue-box__text">Tap the box!</p>
    </div>

    <div class="sparkles" aria-hidden="true">
      <span class="sparkle sparkle--1"><img src="https://www.figma.com/api/mcp/asset/f8ba6161-8fdf-4756-b57c-170538ae9917.svg" alt="" /></span>
      <span class="sparkle sparkle--2"><img src="https://www.figma.com/api/mcp/asset/0424e2aa-0344-4e93-ba45-a2b414d26ea3.svg" alt="" /></span>
      <span class="sparkle sparkle--3"><img src="https://www.figma.com/api/mcp/asset/b46ff96b-49d4-46d5-a5f8-554181f05d58.svg" alt="" /></span>
      <span class="sparkle sparkle--4"><img src="https://www.figma.com/api/mcp/asset/12a189a3-07b2-49d1-83f5-1e871d1e4363.svg" alt="" /></span>
    </div>

    <button class="chest-wrap" id="chestTapTarget" aria-label="Tap the treasure chest to open it">
      <span class="chest-burst" aria-hidden="true"></span>
      <img class="chest chest--closed" src="https://www.figma.com/api/mcp/asset/117c63fd-1acd-4782-9779-7a62848c77ee.svg" alt="" />
      <img class="chest chest--open" src="https://www.figma.com/api/mcp/asset/2e8bc5c8-97bc-4ee4-b103-4d85803dbb3d.svg" alt="" />
    </button>

    <div class="hand-guide" aria-hidden="true">
      <img src="https://www.figma.com/api/mcp/asset/e642959d-241a-4efa-a521-5714e48ff00b.svg" alt="" />
    </div>

    <div class="ticket-tooltip">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 6a2 2 0 012-2h10a2 2 0 012 2v1a1.2 1.2 0 000 2.4V10a2 2 0 01-2 2H4a2 2 0 01-2-2V9.4a1.2 1.2 0 000-2.4V6z" fill="#ee9802"/></svg>
      <span>3 ticket(s) left</span>
    </div>
  </div>

  <!-- info panel -->
  <div class="info-panel">
    <p class="info-panel__copy">1 ticket = 1 chance. Use your ticket(s) before they expire on the 1st of next month!</p>

    <button class="btn-main">Check Rewards Info</button>

    <div class="fomo">
      <p>A lucky player just won <strong>Rp50.000</strong> cashback 🎉</p>
    </div>
  </div>

</div>

<script>
  // Pressed-state handling for interactive elements.
  // CSS :active is unreliable for tap gestures on iOS Safari, so Pointer
  // Events drive an explicit .is-pressed class that mirrors the "pressed"
  // variant defined in the Jago Button design-token doc.
  (function () {
    var PRESSABLE = '.btn-main, .btn-pill-white, .icon-btn, .quick-link__circle-btn';

    function setPressed(el, isPressed) {
      if (!el || el.disabled) return;
      el.classList.toggle('is-pressed', isPressed);
    }

    document.querySelectorAll(PRESSABLE).forEach(function (el) {
      el.addEventListener('pointerdown', function () { setPressed(el, true); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
        el.addEventListener(evt, function () { setPressed(el, false); });
      });
    });
  })();

  // Chest tap-to-open interaction.
  // On first tap: dialogue box + hand guide fade out, and the chest
  // crossfades/grows into its "opened" state (see .is-opened rules in CSS).
  // Only fires once — the reveal doesn't re-trigger on subsequent taps.
  (function () {
    var stage = document.querySelector('.stage');
    var chestBtn = document.getElementById('chestTapTarget');
    if (!stage || !chestBtn) return;

    chestBtn.addEventListener('click', function () {
      if (stage.classList.contains('is-opened')) return;
      stage.classList.add('is-opened');
      chestBtn.disabled = true;
      chestBtn.setAttribute('aria-label', 'Treasure chest opened');
    });
  })();
</script>

</body>
