<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Rewards — Idle</title>

<!--
  ⚠️ ASSET NOTE: the background is now a self-contained Lottie animation
  (embedded inline below, no external dependency — permanent).
  The chest, dialogue-box, gem, and ribbon images are still hosted on
  temporary Figma export URLs, valid for roughly 7 days from generation
  (generated 2026-08-24). Download and self-host those before that window
  closes, or they will break again.
-->

<style>
  /* =========================================================
     DESIGN TOKENS (pulled from Figma node 1355:10055 "Idle"
     and the Jago Button Design System —
     https://figma.com/design/WLEgTddEalEypoLDedveW8)
     ========================================================= */
  :root {
    /* ---- color ---- */
    --color-bg-cream:              #f8f1e8;  /* page bg */
    --accent-primary:              #fdaf27;  /* accent/accent-primary — outline pill + T&C underline */
    --accent-primary-on-color:     #1f1f1f;  /* accent/accent-primary-on-color — "Check Rewards Info" bg */
    --accent-disabled:             #bfbfbf;  /* accent/accent-disabled */
    --button-primary-pressed-bg:   #fdcf7d;  /* button/button-primary-pressed-bg — outline pill pressed border */
    --button-neutral-text:         #ffffff;  /* button/button-neutral-text */
    --button-neutral-pressed-bg:   #828282;  /* button/button-neutral-pressed-bg */
    --text-primary:                #1f1f1f;  /* text/text-primary */
    --text-primary-inverse:        #ffffff;  /* text/text-primary-inverse */
    --text-on-color:               #1f1f1f;  /* text/text-on-color */
    --bg-success:                  #eaf6ea;  /* background/bg-success — tooltip + infobox */

    /* ---- radius ---- */
    --radius-button:               8px;
    --radius-xxl:                  32px;

    /* ---- spacing ---- */
    --space-6:                     6px;
    --space-8:                     8px;
    --space-12:                    12px;

    /* ---- type ---- */
    --font-display: "TT Commons", "Poppins", "Segoe UI", sans-serif;

    --font-size-caption:     15px;
    --line-height-caption:   18px;

    --font-size-subhead:     16px;
    --line-height-subhead:   18px;

    --font-size-subhead-2:   17px;
    --line-height-subhead-2: 20px;

    --font-size-title:       19px;
    --line-height-title:     22px;

    /* ---- effects ---- */
    --shadow-tooltip: 0 0 2px rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #d8d8d8;
    font-family: var(--font-display);
    -webkit-font-smoothing: antialiased;
  }

  /* =========================================================
     SCREEN / FRAME — mobile-first, scales up gracefully
     ========================================================= */
  .screen {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--color-bg-cream);
    overflow: hidden;
    isolation: isolate;
  }

  @media (min-width: 431px) {
    body { display: flex; justify-content: center; padding: 32px 0; }
    .screen {
      min-height: 812px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
  }

  /* =========================================================
     BACKGROUND — forest scene, rendered from the Forest-BG
     Lottie animation (375×812 native, matches the frame exactly).
     Leaves sway subtly via the animation's own keyframes.
     ========================================================= */
  .bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  #forestBgLottie {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #forestBgLottie svg { display: block; }

  /* =========================================================
     HEADER — app bar (close icon + outlined "My Rewards" pill)
     ========================================================= */
  .header {
    position: relative;
    z-index: 6;
    width: 100%;
  }
  .app-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 50px;
    /* Reserve space for the device status bar / notch on every platform */
    padding-top: max(52px, env(safe-area-inset-top, 52px));
    padding-bottom: 13px;
    padding-left: 16px;
    padding-right: 16px;
    width: 100%;
  }

  .icon-btn {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text-primary);
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.12s ease, opacity 0.12s ease;
  }
  .icon-btn svg { width: 100%; height: 100%; }
  .icon-btn:active,
  .icon-btn.is-pressed { background-color: rgba(31,31,31,0.08); }
  .icon-btn:disabled { opacity: 0.4; pointer-events: none; }

  /* SmallButton, outlined pill — "My Rewards" */
  .btn-pill-outline {
    background: transparent;
    border: 1px solid var(--accent-primary);
    border-radius: var(--radius-xxl);
    padding: 5px 14px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--font-size-subhead-2);
    line-height: var(--line-height-subhead-2);
    color: var(--text-primary);
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.12s ease, background-color 0.12s ease, color 0.12s ease;
  }
  .btn-pill-outline:active,
  .btn-pill-outline.is-pressed {
    border-color: var(--button-primary-pressed-bg);
  }
  .btn-pill-outline:disabled {
    border-color: transparent;
    background: var(--accent-disabled);
    color: var(--text-primary-inverse);
    cursor: not-allowed;
    pointer-events: none;
  }

  /* =========================================================
     STAGE — dialogue box, chest, ticket tooltip
     ========================================================= */
  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 380px;
  }

  .dialogue-box {
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 126px;
    height: 91px;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .dialogue-box__shadow {
    position: absolute;
    left: 6.4%;
    top: 3.7%;
    width: 87.2%;
    height: 95.5%;
  }
  .dialogue-box__cloud {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 93.3%;
  }
  .dialogue-box__shadow img,
  .dialogue-box__cloud img { width: 100%; height: 100%; display: block; }
  .dialogue-box__text {
    position: absolute;
    left: 50%;
    top: 32px;
    transform: translateX(-50%);
    width: 90px;
    text-align: center;
    font-weight: 400;
    font-size: var(--font-size-subhead-2);
    line-height: var(--line-height-subhead-2);
    color: var(--text-primary);
    margin: 0;
  }

  /* the new design bakes chest + hand-guide into one flattened animation asset */
  .chest-wrap {
    position: absolute;
    z-index: 1;
    left: 50%;
    top: 99px;
    transform: translateX(calc(-50% + 4px));
    transform-origin: 50% 85%;
    width: 314px;
    height: 268px;
    max-width: 84%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .chest-wrap:disabled { cursor: default; }
  .chest-wrap .chest {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .chest-wrap img.chest { object-fit: contain; }
  .chest-wrap .chest svg { display: block; width: 100%; height: 100%; }
  .chest-wrap .chest--tapped { opacity: 0; }

  .chest-burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 180%;
    height: 180%;
    transform: translate(-50%, -50%) scale(0.3);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(253,175,39,0.55) 0%, rgba(253,175,39,0) 70%);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes chestPopOpen {
    0%   { transform: translateX(calc(-50% + 4px)) scale(0.94); }
    55%  { transform: translateX(calc(-50% + 4px)) scale(1.06); }
    100% { transform: translateX(calc(-50% + 4px)) scale(1); }
  }
  @keyframes chestBurst {
    0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(1);   opacity: 0;   }
  }

  .stage.is-opened .dialogue-box {
    opacity: 0;
    transform: translateX(-50%) scale(0.88) translateY(6px);
    pointer-events: none;
  }
  .stage.is-opened .chest-wrap {
    animation: chestPopOpen 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .stage.is-opened .chest-wrap .chest--idle   { opacity: 0; }
  .stage.is-opened .chest-wrap .chest--tapped { opacity: 1; }
  .stage.is-opened .chest-burst {
    animation: chestBurst 0.7s ease-out forwards;
  }

  .ticket-tooltip {
    position: absolute;
    z-index: 3;
    left: 50%;
    top: 315px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: var(--space-8);
    background: var(--bg-success);
    border-radius: var(--radius-xxl);
    padding: var(--space-6) var(--space-12);
    box-shadow: var(--shadow-tooltip);
    white-space: nowrap;
  }
  .ticket-tooltip svg { width: 18px; height: 18px; flex: none; }
  .ticket-tooltip span {
    font-weight: 600;
    font-size: var(--font-size-caption);
    line-height: var(--line-height-caption);
    color: var(--text-on-color);
  }

  /* =========================================================
     INFO PANEL — infobox, CTA, T&C link
     ========================================================= */
  .info-panel {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: var(--space-12);
    padding: 0 16px;
    padding-bottom: 32px;
  }

  .infobox {
    background: var(--bg-success);
    border-radius: var(--radius-button);
    padding: var(--space-8) var(--space-12);
    margin: 0;
    text-align: center;
    font-weight: 400;
    font-size: var(--font-size-caption);
    line-height: var(--line-height-caption);
    color: var(--text-primary);
  }

  .btn-main {
    appearance: none;
    border: none;
    background: var(--accent-primary-on-color);
    border-radius: var(--radius-button);
    padding: 14px 24px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--font-size-title);
    line-height: var(--line-height-title);
    color: var(--button-neutral-text);
    text-align: center;
    cursor: pointer;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.12s ease;
  }
  .btn-main:active,
  .btn-main.is-pressed { background: var(--button-neutral-pressed-bg); }
  .btn-main:disabled {
    background: var(--accent-disabled);
    color: var(--text-primary-inverse);
    cursor: not-allowed;
    pointer-events: none;
  }
  .btn-main:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

  /* MainButton/type=text — "Terms & Conditions" */
  .btn-text {
    appearance: none;
    background: none;
    border: none;
    padding: 14px 24px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-text__label {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--font-size-title);
    line-height: var(--line-height-title);
    color: var(--text-primary);
    border-bottom: 1px solid var(--accent-primary);
    padding-bottom: 1px;
    transition: border-color 0.12s ease;
  }
  .btn-text:active .btn-text__label,
  .btn-text.is-pressed .btn-text__label {
    border-color: var(--button-primary-pressed-bg);
  }
  .btn-text:disabled .btn-text__label {
    color: var(--accent-disabled);
    border-color: var(--accent-disabled);
  }
  .btn-text:disabled { cursor: not-allowed; pointer-events: none; }

  /* =========================================================
     REWARD MODAL — "Grand Prize" celebration (Figma node 1489:9029)
     Sits above the tapped-chest scene, below the header.
     ========================================================= */
  .reward-modal {
    position: absolute;
    inset: 0;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .screen.show-reward .reward-modal {
    opacity: 1;
    pointer-events: auto;
  }

  .reward-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4); /* background/bg-transparent-dark-40 */
    cursor: pointer;
  }

  /* crown + gem cluster: Grand Prize Lottie animation, edge-to-edge */
  .reward-crown {
    position: absolute;
    left: 0;
    top: 48px;
    width: 100%;
    height: 320px;
    overflow: hidden;
    pointer-events: none;
  }
  .reward-crown svg { display: block; width: 100%; height: 100%; }

  /* plain celebration title, no ribbon banner in this version */
  .reward-title {
    position: absolute;
    left: 50%;
    top: 310px; /* = 38.18% of 812px reference height */
    transform: translateX(-50%) translateY(10px) scale(0.85);
    margin: 0;
    width: 277px;
    max-width: 74%;
    text-align: center;
    font-weight: 600;
    font-size: 26px;
    line-height: 28px;
    color: var(--text-primary-inverse);
    opacity: 0;
  }
  .reward-title.is-revealed {
    animation: rewardTitleReveal 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes rewardTitleReveal {
    0%   { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.85); }
    60%  { opacity: 1; transform: translateX(-50%) translateY(-2px) scale(1.04); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  /* voucher card */
  .reward-card {
    position: absolute;
    left: 50%;
    top: 350.5px;
    transform: translateX(-50%) translateY(20px);
    width: 270px;
    max-width: 72%;
    padding: 0 16px 16px;
    border-radius: 0 0 12px 12px;
    background:
      linear-gradient(180deg, #fdecA9 0%, #fde47f 15%, rgba(255,255,255,0) 100%),
      linear-gradient(90deg, #ffffff 0%, #ffffff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
  }
  .reward-card.is-revealed {
    animation: rewardCardSlideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    pointer-events: auto;
  }
  @keyframes rewardCardSlideUp {
    0%   { opacity: 0; transform: translateX(-50%) translateY(20px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .reward-asset {
    position: relative;
    width: 100%;
    height: 112px;
    border-radius: 12px 12px 0 0;
    overflow: hidden;
  }
  /* decorative sparkle bursts flanking the voucher title */
  .reward-asset__sparkle {
    position: absolute;
    top: -46px;
    width: 182.164px;
    height: 184.655px;
    pointer-events: none;
  }
  .reward-asset__sparkle img { width: 100%; height: 100%; display: block; }
  .reward-asset__sparkle--right { right: -53.16px; transform: rotate(15deg); }
  .reward-asset__sparkle--left  { left: -53px; transform: rotate(165deg) scaleY(-1); }
  .reward-asset__title {
    position: absolute;
    left: 50%;
    top: 32px;
    transform: translateX(-50%);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    white-space: nowrap;
    color: var(--text-primary);
  }
  .reward-asset__title span:first-child { font-weight: 600; font-size: 22px; line-height: 24px; }
  .reward-asset__title span:last-child  { font-weight: 600; font-size: 26px; line-height: 28px; }

  .reward-copy {
    background: #ffffff;
    border-radius: var(--radius-button);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    width: 100%;
    cursor: pointer;
    border: none;
    -webkit-tap-highlight-color: transparent;
  }
  .reward-copy__text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    text-align: left;
    min-width: 0;
  }
  .reward-copy__label {
    font-weight: 400;
    font-size: var(--font-size-caption);
    line-height: var(--line-height-caption);
    color: #666666;
  }
  .reward-copy__code {
    font-weight: 600;
    font-size: var(--font-size-subhead-2);
    line-height: var(--line-height-subhead-2);
    color: #a605ad;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .reward-copy__icon { width: 24px; height: 24px; flex: none; color: var(--text-primary); }
  .reward-copy__icon svg { width: 100%; height: 100%; }

  .reward-caption {
    margin: 0;
    text-align: center;
    font-weight: 400;
    font-size: var(--font-size-caption);
    line-height: var(--line-height-caption);
    color: #666666;
  }

  .reward-cta {
    appearance: none;
    border: none;
    width: 100%;
    background: var(--accent-primary);
    border-radius: var(--radius-button);
    padding: 9px 24px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--font-size-title);
    line-height: var(--line-height-title);
    color: var(--text-primary);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: filter 0.12s ease;
  }
  .reward-cta:active,
  .reward-cta.is-pressed { filter: brightness(0.94); }

  /* Respect reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="screen">

  <!-- background: forest scene, Lottie animation (leaves sway) -->
  <div class="bg" aria-hidden="true">
    <div id="forestBgLottie"></div>
  </div>

  <!-- header -->
  <header class="header">
    <div class="app-bar">
      <button class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="btn-pill-outline">My Rewards</button>
    </div>
  </header>

  <!-- stage: dialogue + chest + ticket -->
  <div class="stage">
    <div class="dialogue-box" aria-hidden="true">
      <span class="dialogue-box__shadow">
        <img src="https://www.figma.com/api/mcp/asset/895a508a-2095-4029-bdcb-8f073d305b76.svg" alt="" />
      </span>
      <span class="dialogue-box__cloud">
        <img src="https://www.figma.com/api/mcp/asset/e38e047e-3ca2-4a0e-a05e-dc08b6254ab8.svg" alt="" />
      </span>
      <p class="dialogue-box__text">Tap the box!</p>
    </div>

    <button class="chest-wrap" id="chestTapTarget" aria-label="Tap the treasure chest to open it">
      <span class="chest-burst" aria-hidden="true"></span>
      <div class="chest chest--idle" id="chestLottie"></div>
      <div class="chest chest--tapped" id="chestTappedLottie"></div>
    </button>

    <div class="ticket-tooltip">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 6a2 2 0 012-2h10a2 2 0 012 2v1a1.2 1.2 0 000 2.4V10a2 2 0 01-2 2H4a2 2 0 01-2-2V9.4a1.2 1.2 0 000-2.4V6z" fill="#ee9802"/></svg>
      <span>3 ticket(s) left</span>
    </div>
  </div>

  <!-- info panel -->
  <div class="info-panel">
    <p class="infobox">1 ticket = 1 chance. Use your ticket(s) before they expire on the 1st of next month!</p>

    <button class="btn-main" id="mainCta">Check Rewards Info</button>

    <button class="btn-text"><span class="btn-text__label">Terms &amp; Conditions</span></button>
  </div>

  <!-- reward modal: "Grand Prize" celebration (Figma node 1901:15897) -->
  <div class="reward-modal" id="rewardModal" aria-hidden="true">
    <div class="reward-overlay"></div>

    <div class="reward-crown" id="rewardCrownLottie" aria-hidden="true"></div>

    <p class="reward-title">You won a Grand Prize!</p>

    <div class="reward-card" role="dialog" aria-label="Grand prize reward">
      <div class="reward-asset">
        <span class="reward-asset__sparkle reward-asset__sparkle--right" aria-hidden="true">
          <img src="https://www.figma.com/api/mcp/asset/13947f9a-fa54-494d-a2d0-6940dbc996e6.svg" alt="" />
        </span>
        <span class="reward-asset__sparkle reward-asset__sparkle--left" aria-hidden="true">
          <img src="https://www.figma.com/api/mcp/asset/e7833e6e-b9e4-4739-a6e9-c9ea8922f7ba.svg" alt="" />
        </span>
        <p class="reward-asset__title">
          <span>Traveloka Voucher</span>
          <span>Rp10.000.000</span>
        </p>
      </div>

      <button class="reward-copy" id="copyVoucherBtn" aria-label="Copy voucher code">
        <span class="reward-copy__text">
          <span class="reward-copy__label" id="copyVoucherLabel">Voucher Code</span>
          <span class="reward-copy__code">JAGO-1234-ABCD</span>
        </span>
        <span class="reward-copy__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" stroke="currentColor" stroke-width="1.8"/></svg>
        </span>
      </button>

<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<script>
  // Forest background: Lottie animation (leaves sway via its own keyframes).
  (function () {
    var dataEl = document.getElementById('forest-bg-data');
    var container = document.getElementById('forestBgLottie');
    if (!dataEl || !container || typeof lottie === 'undefined') return;

    var animationData;
    try {
      animationData = JSON.parse(dataEl.textContent);
    } catch (e) {
      console.error('Forest background: failed to parse Lottie JSON', e);
      return;
    }

    lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      animationData: animationData,
      rendererSettings: { preserveAspectRatio: 'xMidYMid slice' }
    });
  })();

  // Treasure chest idle animation (replaces the old static-image + CSS
  // shake — this Lottie already contains the chest's idle motion and
  // hand-tap gesture natively).
  var chestIdleAnim = null;
  (function () {
    var dataEl = document.getElementById('chest-idle-data');
    var container = document.getElementById('chestLottie');
    if (!dataEl || !container || typeof lottie === 'undefined') return;

    var animationData;
    try {
      animationData = JSON.parse(dataEl.textContent);
    } catch (e) {
      console.error('Chest idle animation: failed to parse Lottie JSON', e);
      return;
    }

    chestIdleAnim = lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      animationData: animationData,
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    });
  })();

  // Treasure chest "tapped" animation — plays once when the chest is tapped.
  var chestTappedAnim = null;
  (function () {
    var dataEl = document.getElementById('chest-tapped-data');
    var container = document.getElementById('chestTappedLottie');
    if (!dataEl || !container || typeof lottie === 'undefined') return;

    var animationData;
    try {
      animationData = JSON.parse(dataEl.textContent);
    } catch (e) {
      console.error('Chest tapped animation: failed to parse Lottie JSON', e);
      return;
    }

    chestTappedAnim = lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: false,
      autoplay: false,
      animationData: animationData,
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    });
  })();

  // Grand Prize crown + gem cluster animation — loaded eagerly (so it's
  // ready instantly) but not played until the reward modal is revealed.
  var grandPrizeAnim = null;
  (function () {
    var dataEl = document.getElementById('grand-prize-data');
    var container = document.getElementById('rewardCrownLottie');
    if (!dataEl || !container || typeof lottie === 'undefined') return;

    var animationData;
    try {
      animationData = JSON.parse(dataEl.textContent);
    } catch (e) {
      console.error('Grand Prize animation: failed to parse Lottie JSON', e);
      return;
    }

    grandPrizeAnim = lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: false,
      autoplay: false,
      animationData: animationData,
      rendererSettings: { preserveAspectRatio: 'xMidYMid slice' }
    });
  })();

  // Pressed-state handling for interactive elements.
  (function () {
    var PRESSABLE = '.btn-main, .btn-pill-outline, .btn-text, .icon-btn, .reward-cta, .reward-copy';

    function setPressed(el, isPressed) {
      if (!el || el.disabled) return;
      el.classList.toggle('is-pressed', isPressed);
    }

    document.querySelectorAll(PRESSABLE).forEach(function (el) {
      el.addEventListener('pointerdown', function () { setPressed(el, true); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
        el.addEventListener(evt, function () { setPressed(el, false); });
      });
    });
  })();

  // Chest tap interaction (matches Figma node 1355:10216 "Tap 1x"):
  // dialogue box fades out, chest crossfades from the idle (with hand)
  // artwork to the tapped (hand removed) artwork, and the CTA button
  // label swaps from "Check Rewards Info" to "See Remaining Rewards".
  // After a short beat (letting the pop/burst animation play), the
  // "Grand Prize" reward modal reveals (node 1489:9029).
  (function () {
    var screen = document.querySelector('.screen');
    var stage = document.querySelector('.stage');
    var chestBtn = document.getElementById('chestTapTarget');
    var mainCta = document.getElementById('mainCta');
    if (!screen || !stage || !chestBtn) return;

    chestBtn.addEventListener('click', function () {
      if (stage.classList.contains('is-opened')) return;
      stage.classList.add('is-opened');
      chestBtn.disabled = true;
      chestBtn.setAttribute('aria-label', 'Treasure chest opened');
      if (mainCta) mainCta.textContent = 'See Remaining Rewards';
      if (chestIdleAnim) chestIdleAnim.pause();
      if (chestTappedAnim) chestTappedAnim.goToAndPlay(0, true);

      window.setTimeout(function () {
        screen.classList.add('show-reward');
        var rewardModal = document.getElementById('rewardModal');
        if (rewardModal) rewardModal.setAttribute('aria-hidden', 'false');
        if (grandPrizeAnim) grandPrizeAnim.goToAndPlay(0, true);
        var rewardTitle = document.querySelector('.reward-title');
        if (rewardTitle) rewardTitle.classList.add('is-revealed');

        // The voucher card slides up (receipt-style) shortly after the
        // Grand Prize animation starts.
        window.setTimeout(function () {
          var rewardCard = document.querySelector('.reward-card');
          if (rewardCard) rewardCard.classList.add('is-revealed');
        }, 1000);
      }, 700);
    });
  })();

  // Reward modal: copy voucher code, dismiss via CTA, reset via overlay tap.
  (function () {
    var screen = document.querySelector('.screen');
    var copyBtn = document.getElementById('copyVoucherBtn');
    var copyLabel = document.getElementById('copyVoucherLabel');
    var rewardCta = document.getElementById('rewardCta');
    var rewardModal = document.getElementById('rewardModal');
    var overlay = document.querySelector('.reward-overlay');
    var VOUCHER_CODE = 'JAGO-1234-ABCD';

    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(VOUCHER_CODE).catch(function () {});
        }
        if (copyLabel) {
          var original = copyLabel.textContent;
          copyLabel.textContent = 'Copied!';
          window.setTimeout(function () { copyLabel.textContent = original; }, 1500);
        }
      });
    }

    if (rewardCta && screen && rewardModal) {
      rewardCta.addEventListener('click', function () {
        screen.classList.remove('show-reward');
        rewardModal.setAttribute('aria-hidden', 'true');
      });
    }

    // Tapping the dark backdrop is a full reset — back to the original
    // idle screen (dialogue box returns, chest re-shakes, CTA reverts).
    if (overlay && screen && rewardModal) {
      overlay.addEventListener('click', function () {
        var stage = document.querySelector('.stage');
        var chestBtn = document.getElementById('chestTapTarget');
        var mainCta = document.getElementById('mainCta');
        var rewardTitle = document.querySelector('.reward-title');
        var rewardCard = document.querySelector('.reward-card');

        screen.classList.remove('show-reward');
        rewardModal.setAttribute('aria-hidden', 'true');
        if (rewardTitle) rewardTitle.classList.remove('is-revealed');
        if (rewardCard) rewardCard.classList.remove('is-revealed');

        if (stage) stage.classList.remove('is-opened');
        if (chestBtn) {
          chestBtn.disabled = false;
          chestBtn.setAttribute('aria-label', 'Tap the treasure chest to open it');
        }
        if (mainCta) mainCta.textContent = 'Check Rewards Info';

        if (chestTappedAnim) chestTappedAnim.goToAndStop(0, true);
        if (grandPrizeAnim) grandPrizeAnim.goToAndStop(0, true);
        if (chestIdleAnim) chestIdleAnim.goToAndPlay(0, true);
      });
    }
  })();
</script>
